# Public-HTTPS overlay for a VM deployment (see docs/DEPLOY-ORACLE.md).
#
# Adds Caddy in front of the web container: it terminates TLS and reverse-proxies
# to nginx, obtaining and renewing a Let's Encrypt certificate for PUBLIC_DOMAIN
# with no manual step. Keep the web container off the public interface by setting
# WEB_PORT=127.0.0.1:8080 in .env — Caddy reaches it over the compose network, so
# nothing but Caddy needs a public port.
#
# On the server, either pass both files:
#   docker compose -f docker-compose.yml -f docker-compose.public.yml up -d --build
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.public.yml in .env and
# then just `docker compose up -d --build`.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys survive restarts here — without this volume
      # Caddy re-requests a cert on every boot and hits Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
