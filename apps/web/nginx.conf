server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # GitHub push payloads can be large; the API's own limit is the real guard.
  client_max_body_size 6m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed filenames, so these can never go stale.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Same-origin proxy. This is what lets the session cookie stay
  # SameSite=Strict and the webhook share the panel's public URL.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # An LLM call plus a Discord round trip can exceed the 60s default.
    proxy_read_timeout 120s;
  }

  # Client-side routing: unknown paths are app routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store";
  }
}
